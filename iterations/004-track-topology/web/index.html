<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porsche Unleashed — просмотр моделей и трасс</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="viewer">
      <section class="toolbar" aria-label="Управление просмотром">
        <label class="field" title="Выбрать локальную папку игры (переопределить)">
          <span>Папка игры</span>
          <input id="folderInput" type="file" webkitdirectory multiple />
        </label>
        <label class="field" title="Выбрать отдельные файлы игры">
          <span>Файлы</span>
          <input id="fileInput" type="file" multiple />
        </label>
        <span id="sourceBadge" class="source-badge" title="Текущий источник ресурсов игры">local/game</span>
        <button id="resetSourceButton" type="button" class="btn-subtle" style="display:none" title="Вернуться к файлам local/game">К local/game</button>
        <label class="field">
          <span>Режим</span>
          <select id="modeSelect">
            <option value="track" selected>Трасса</option>
            <option value="car">Авто</option>
          </select>
        </label>
        <label class="field">
          <span id="targetLabel">Трасса</span>
          <select id="targetSelect"></select>
        </label>
        <label class="checkbox-field" id="topologyField" title="Показать/скрыть 3D границы трассы (T)">
          <input id="topologyCheckbox" type="checkbox" checked />
          <span>3D Границы</span>
        </label>
        <button id="tourButton" type="button" title="Режим аркадного заезда на авто / прогона (F)">Заезд (F)</button>
        <button id="cameraButton" type="button" title="Сменить вид камеры: Сзади / Капот / Свободный (C)">Вид (C)</button>
        <button id="paintButton" type="button" title="Сменить цвет кузова авто (P)">Цвет (P)</button>
        <button id="loadButton" type="button">Загрузить</button>
        <button id="resetButton" type="button" title="Сброс камеры / возврат на трассу (R)">R</button>
        <span id="status" role="status">Выберите папку игры или файлы трассы/авто.</span>
        <span class="hint" title="Горячие клавиши">F: заезд &bull; WASD: газ/руль &bull; Space: ручник &bull; C: вид &bull; P: цвет &bull; R: сброс &bull; T: границы</span>
      </section>
      <div class="viewport-wrapper">
        <canvas id="viewport"></canvas>
        <div id="hud" class="hud" hidden>
          <div class="hud-main">
            <div class="hud-speed-gauge">
              <span id="speedValue" class="speed-val">0</span>
              <span class="speed-unit">КМ/Ч</span>
            </div>
            <div class="hud-gear-container">
              <span class="gear-title">ПЕРЕДАЧА</span>
              <span id="gearValue" class="gear-val">N</span>
            </div>
          </div>
          <div class="hud-rpm-wrapper" title="Тахометр">
            <div id="rpmBar" class="hud-rpm-fill"></div>
          </div>
          <div class="hud-hint">
            <span><b>W/▲</b> Газ</span> &bull;
            <span><b>S/▼</b> Тормоз/Назад</span> &bull;
            <span><b>A/D</b> Руль</span> &bull;
            <span><b>Space</b> Ручник</span> &bull;
            <span><b>C</b> Камера</span> &bull;
            <span><b>R</b> На трассу</span>
          </div>
        </div>
      </div>
      <pre id="summary" aria-live="polite"></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
