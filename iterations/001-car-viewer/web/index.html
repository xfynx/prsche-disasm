<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porsche Unleashed — просмотр моделей</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="viewer">
      <section class="toolbar" aria-label="Управление просмотром">
        <label class="field">
          <span>Папка игры</span>
          <input id="folderInput" type="file" webkitdirectory multiple />
        </label>
        <label class="field">
          <span>Файлы</span>
          <input id="fileInput" type="file" multiple />
        </label>
        <label class="car">
          <span>Авто</span>
          <input id="carInput" value="356a" autocomplete="off" list="carOptions" />
          <datalist id="carOptions"></datalist>
        </label>
        <button id="loadButton" type="button">Загрузить</button>
        <button id="resetButton" type="button" title="Сброс камеры">R</button>
        <span id="status" role="status">Выберите папку игры или CRP, TPG и общие FSH-файлы.</span>
      </section>
      <canvas id="viewport"></canvas>
      <pre id="summary" aria-live="polite"></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
